<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - Güvenli Sıfırlama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background-color: #edf2f7;
            color: #4a5568;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
        }

        h2 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.15);
        }

        button:hover {
            background-color: #2b6cb0;
        }

        button:active {
            transform: scale(0.98);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #4a5568;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .back-link:hover {
            color: #3182ce;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">🔒</div>
    <h2>Şifre Sıfırlama</h2>
    <p>Hesabınıza ait e-posta adresinizi girin, size şifre yenileme bağlantısı oluşturalım.</p>
    
    <form action="/sifremi-unuttum-gonder" method="POST">
        <div class="form-group">
            <label for="email">E-Posta Adresiniz</label>
            <input type="email" id="email" name="email" placeholder="ornek@alanadi.com" required autocomplete="email">
        </div>
        
        <button type="submit">Bağlantı Gönder</button>
    </form>
    
    <a href="/login" class="back-link">← Giriş Sayfasına Dön</a>
</div>

</body>
</html>
